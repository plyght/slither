<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <title>slither</title>
    <meta name="description" content="A fast, hybrid web search engine by plyght. BM25 + semantic search across 40,000+ indexed pages.">
    <meta property="og:title" content="slither — search">
    <meta property="og:description" content="A fast, hybrid web search engine by plyght.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='60 40 280 280' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M100 200L150 60 200 60 150 200ZM300 200L250 60 200 60 250 200ZM175 120H225V300H175ZM80 200L320 200 280 250 120 250Z' fill='%230a0a0a' fill-rule='evenodd'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-state="home">
    <div class="app">
        <div class="content-wrap">
            <div class="brand" id="brand">
                <svg class="brand-mark" viewBox="60 40 280 280" xmlns="http://www.w3.org/2000/svg" aria-label="plyght">
                    <path d="M100 200L150 60 200 60 150 200ZM300 200L250 60 200 60 250 200ZM175 120H225V300H175ZM80 200L320 200 280 250 120 250Z" fill="currentColor" fill-rule="evenodd"/>
                </svg>
                <h1 class="brand-title" id="brandTitle">slither</h1>
                <p class="brand-tagline" id="brandTagline"><em>loading index&hellip;</em></p>
            </div>

            <form class="search-form" id="searchForm" role="search" action="#">
                <div class="search-field">
                    <input
                        type="search"
                        class="search-input"
                        id="searchInput"
                        placeholder="Search the web&hellip;"
                        autocomplete="off"
                        autofocus
                        aria-label="Search query"
                        role="combobox"
                        aria-expanded="false"
                        aria-controls="autocompleteList"
                        aria-autocomplete="list"
                    >
                    <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                    <button type="submit" class="search-submit" aria-label="Search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </button>
                    <div class="autocomplete" id="autocomplete">
                        <ul class="autocomplete-list" id="autocompleteList" role="listbox"></ul>
                        <div class="autocomplete-hint"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span><span><kbd>Enter</kbd> select &middot; <kbd>Esc</kbd> close</span></div>
                    </div>
                </div>
                <div class="search-modes" id="searchModes">
                    <button type="button" class="mode-btn active" data-mode="hybrid">hybrid</button>
                    <button type="button" class="mode-btn" data-mode="text">text</button>
                    <button type="button" class="mode-btn" data-mode="semantic">semantic</button>
                </div>
            </form>

            <div class="kbd-hint">Press <kbd>/</kbd> to search</div>
        </div>

        <main class="results-section" id="resultsSection" aria-live="polite">
            <div class="results-ornament" aria-hidden="true"></div>
            <div class="results-meta" id="resultsMeta"></div>
            <div class="results-list" id="resultsList"></div>
        </main>

        <footer class="site-footer">
            <a href="https://peril.lol" class="footer-credit" style="text-decoration:none">  
                <svg class="footer-flag" viewBox="0 0 1235 650" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect fill="currentColor" width="1235" height="650"/>
                    <path d="M0,75 L1235,75 M1235,175 L0,175 M0,275 L1235,275 M1235,375 L0,375 M0,475 L1235,475 M1235,575 L0,575" stroke="var(--bg-primary)" stroke-width="50" fill="currentColor"/>
                    <rect fill="currentColor" width="494" height="350"/>
                    <path d="M147,195 L197,55 L247,55 L197,195Z M347,195 L297,55 L247,55 L297,195Z M222,115 L272,115 L272,295 L222,295Z M127,195 L367,195 L327,245 L167,245Z" fill="var(--bg-primary)"/>
                </svg>
            </a>
            <button class="palette-btn" id="paletteBtn" aria-label="Change color scheme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
                </svg>
            </button>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
